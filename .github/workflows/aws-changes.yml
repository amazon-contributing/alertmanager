name: aws-changes
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * MON"     # catches upstream-absorbed changes retiring without a merge
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: aws-changes-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://github.com/prometheus/alertmanager
      UPSTREAM_BRANCH: main
      PUBLISH_BRANCH: aws-changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: git remote add upstream "$UPSTREAM" && git fetch -q upstream "$UPSTREAM_BRANCH"
      - name: Regenerate manifest
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/publish
          python3 .github/scripts/generate_aws_changes.py \
            --upstream-ref "upstream/$UPSTREAM_BRANCH" \
            --repo-url "https://github.com/$REPO" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "refs/heads/main" > /tmp/publish/AWS-CHANGES.md
          cat > /tmp/publish/README.md <<'EOF'
          # AWS-CHANGES publish branch

          This orphan branch carries only the auto-generated manifest of AWS changes
          this fork holds on top of upstream Alertmanager: **[AWS-CHANGES.md](AWS-CHANGES.md)**.

          It is regenerated by the `aws-changes` workflow on every push to `main`
          (plus weekly, to retire changes upstream has absorbed). Nothing here is
          edited by hand, and no pull request is involved. Code lives on `main`.
          EOF
      - name: Publish to the manifest branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aws-fork-bot"
          git config user.email "noreply@amazon.com"
          # Orphan worktree: the branch shares no history with main.
          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$PUBLISH_BRANCH"
            git worktree add -q /tmp/pb "origin/$PUBLISH_BRANCH" --detach
            git -C /tmp/pb checkout -q -B "$PUBLISH_BRANCH"
          else
            git worktree add -q --detach /tmp/pb
            git -C /tmp/pb checkout -q --orphan "$PUBLISH_BRANCH"
            git -C /tmp/pb rm -rq --cached . 2>/dev/null || true
            find /tmp/pb -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp /tmp/publish/AWS-CHANGES.md /tmp/publish/README.md /tmp/pb/
          cd /tmp/pb
          git add AWS-CHANGES.md README.md
          if git diff --cached --quiet; then
            echo "manifest unchanged — nothing to publish"
            exit 0
          fi
          git commit -q -m "Publish AWS-CHANGES.md from ${GITHUB_SHA:0:10}"
          git push -q origin "$PUBLISH_BRANCH"
          echo "published to $PUBLISH_BRANCH"

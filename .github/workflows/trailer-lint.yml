name: trailer-lint
on:
  pull_request:
    branches: [main]
jobs:
  trailer-lint:
    if: ${{ !startsWith(github.head_ref, 'sync/upstream-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit trailers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-trailers.sh "origin/${BASE_REF}..HEAD"